<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>Defensa de Asteroides</title><style>*{box-sizing:border-box}body{margin:0;background:#070d20;color:#fff;font-family:system-ui,Arial;display:grid;place-items:center;min-height:100dvh;padding:8px;overflow-x:hidden}.wrap{width:min(100%,850px)}h1{margin:12px 0;text-align:center;color:#8be9ff}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}.pill{background:#182747;padding:9px 14px;border-radius:12px}button{min-height:44px;background:#37c5ec;border:0;border-radius:10px;padding:10px 17px;font-weight:800;cursor:pointer}canvas{display:block;width:100%;background:#030916;border:2px solid #385b88;border-radius:16px;touch-action:none;max-height:70dvh;object-fit:contain}p{text-align:center;color:#aabbd9;font-size:14px}@media(max-width:600px){body{display:block;padding:6px}.wrap{width:100%}h1{font-size:20px;margin:6px 0}.bar{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:6px 0}.pill{text-align:center;padding:8px 3px;font-size:13px}.bar button{grid-column:span 3;width:100%}canvas{border-radius:10px}p{font-size:12px;margin:8px 0}}@media(orientation:landscape) and (max-height:550px){h1{display:none}.bar{display:flex;flex-wrap:nowrap}.bar button{width:auto}canvas{max-height:75dvh}} </style></head><body><div class="wrap"><h1>🚀 Defensa de Asteroides</h1><div class="bar"><span class="pill">Puntos: <b id="score">0</b></span><span class="pill">Vidas: <b id="lives">3</b></span><span class="pill">Nivel: <b id="level">1</b></span><button id="start">Iniciar / Reiniciar</button><button id="full" type="button">⛶ Pantalla completa</button></div><canvas id="game" width="850" height="520"></canvas><p>Toca los asteroides para disparar desde tu nave. Puedes jugar en vertical u horizontal. Destruye asteroides antes de que lleguen a tu nave.</p></div><script>
const c=document.getElementById('game'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),levelEl=document.getElementById('level');let score=0,lives=3,level=1,playing=false,rocks=[],shots=[],particles=[],stars=[],last=0,spawn=0,aim={x:425,y:180},ship={x:425,y:470},raf=0;for(let i=0;i<115;i++)stars.push({x:Math.random()*850,y:Math.random()*520,r:Math.random()*1.6+.3});function reset(){score=0;lives=3;level=1;rocks=[];shots=[];particles=[];spawn=0;playing=true;last=performance.now();updateHud();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}function updateHud(){scoreEl.textContent=score;livesEl.textContent=lives;levelEl.textContent=level}document.getElementById('start').onclick=reset;document.getElementById('full').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{});}else{document.exitFullscreen?.();}};function pointer(e){const r=c.getBoundingClientRect();aim.x=(e.clientX-r.left)*850/r.width;aim.y=(e.clientY-r.top)*520/r.height}c.addEventListener('pointermove',pointer);c.addEventListener('pointerdown',e=>{e.preventDefault();pointer(e);fire()});c.addEventListener('pointermove',e=>{if(e.pointerType==='touch')e.preventDefault();pointer(e)},{passive:false});function fire(){if(!playing)return;const dx=aim.x-ship.x,dy=aim.y-ship.y,d=Math.hypot(dx,dy)||1;shots.push({x:ship.x,y:ship.y-20,vx:dx/d*850,vy:dy/d*850,r:5})}document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();fire()}});function asteroid(){const r=17+Math.random()*22;rocks.push({x:35+Math.random()*780,y:-r,r,v:75+level*15+Math.random()*50,spin:Math.random()*6,rot:Math.random()*6,edges:Array.from({length:10},()=>.78+Math.random()*.35)})}function boom(px,py,color,count=14){for(let i=0;i<count;i++){let a=Math.random()*Math.PI*2,s=30+Math.random()*190;particles.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.45,color})}}function loop(now){const dt=Math.min((now-last)/1000,.04);last=now;x.clearRect(0,0,850,520);x.fillStyle='#050b1b';x.fillRect(0,0,850,520);for(const s of stars){x.fillStyle='#9ebbe8';x.globalAlpha=.3+s.r/2.5;x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()}x.globalAlpha=1;spawn+=dt;if(playing&&spawn>Math.max(.28,1.05-level*.07)){spawn=0;asteroid()}for(const r of rocks){if(playing){r.y+=r.v*dt;r.rot+=dt}x.save();x.translate(r.x,r.y);x.rotate(r.rot);x.fillStyle='#7d899f';x.strokeStyle='#d0d9e5';x.lineWidth=3;x.beginPath();r.edges.forEach((m,i)=>{let a=i*Math.PI*2/r.edges.length,xx=Math.cos(a)*r.r*m,yy=Math.sin(a)*r.r*m;i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.closePath();x.fill();x.stroke();x.restore()}if(playing){for(const s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt}for(let i=rocks.length-1;i>=0;i--){let r=rocks[i];if(r.y-r.r>520){rocks.splice(i,1);lives--;boom(r.x,490,'#ff5b70');updateHud();continue}for(let j=shots.length-1;j>=0;j--){let s=shots[j];if(Math.hypot(s.x-r.x,s.y-r.y)<r.r+s.r){shots.splice(j,1);rocks.splice(i,1);boom(r.x,r.y,'#ffc76b');score+=10;level=1+Math.floor(score/100);updateHud();break}}}shots=shots.filter(s=>s.x>-10&&s.x<860&&s.y>-10&&s.y<530);if(lives<=0)playing=false}for(const s of shots){x.fillStyle='#42efff';x.shadowColor='#42efff';x.shadowBlur=13;x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill();x.shadowBlur=0}particles=particles.filter(p=>p.life>0);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;x.globalAlpha=Math.max(0,p.life);x.fillStyle=p.color;x.fillRect(p.x,p.y,4,4)}x.globalAlpha=1;x.save();x.translate(ship.x,ship.y);x.fillStyle='#38d6e8';x.strokeStyle='#d5faff';x.lineWidth=3;x.beginPath();x.moveTo(0,-28);x.lineTo(23,21);x.lineTo(0,12);x.lineTo(-23,21);x.closePath();x.fill();x.stroke();x.restore();x.strokeStyle='#65dfff';x.beginPath();x.arc(aim.x,aim.y,13,0,7);x.moveTo(aim.x-20,aim.y);x.lineTo(aim.x-8,aim.y);x.moveTo(aim.x+8,aim.y);x.lineTo(aim.x+20,aim.y);x.moveTo(aim.x,aim.y-20);x.lineTo(aim.x,aim.y-8);x.stroke();if(!playing){x.fillStyle='#000b';x.fillRect(0,0,850,520);x.textAlign='center';x.fillStyle='white';x.font='bold 35px system-ui';x.fillText(lives<=0?'¡Fin del juego!':'¡Defiende la nave!',425,235);x.font='20px system-ui';x.fillText(lives<=0?'Puntuación final: '+score:'Pulsa Iniciar para jugar',425,276)}raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop);
</script></body></html>
